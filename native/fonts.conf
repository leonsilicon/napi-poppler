<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir>/System/Library/Fonts</dir>
  <dir>/Library/Fonts</dir>
  <dir>~/Library/Fonts</dir>
  <dir>~/.fonts</dir>
  <dir prefix="xdg">fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <alias><family>Helvetica</family><prefer><family>Arial</family><family>Liberation Sans</family><family>DejaVu Sans</family></prefer></alias>
  <alias><family>Times</family><prefer><family>Times New Roman</family><family>Liberation Serif</family><family>DejaVu Serif</family></prefer></alias>
  <alias><family>Courier</family><prefer><family>Courier New</family><family>Liberation Mono</family><family>DejaVu Sans Mono</family></prefer></alias>
</fontconfig>
