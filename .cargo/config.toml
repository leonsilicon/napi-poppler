[env]
SYSTEM_DEPS_LINK = "static"
PKG_CONFIG_ALL_STATIC = "1"
PKG_CONFIG_ALLOW_CROSS = "1"
PKG_CONFIG_PATH = ""
PKG_CONFIG_LIBDIR_aarch64_apple_darwin = { value = ".native/vcpkg/installed/arm64-osx/lib/pkgconfig", relative = true }
PKG_CONFIG_LIBDIR_aarch64_unknown_linux_gnu = { value = ".native/vcpkg/installed/arm64-linux/lib/pkgconfig", relative = true }
PKG_CONFIG_LIBDIR_x86_64_unknown_linux_gnu = { value = ".native/vcpkg/installed/x64-linux/lib/pkgconfig", relative = true }
PKG_CONFIG_LIBDIR_x86_64_pc_windows_msvc = { value = ".native/vcpkg/installed/x64-windows-static-md/lib/pkgconfig", relative = true }
PKG_CONFIG_x86_64_pc_windows_msvc = { value = ".native/vcpkg/installed/x64-windows/tools/pkgconf/pkgconf.exe", relative = true }
